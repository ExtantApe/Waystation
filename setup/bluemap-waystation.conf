# BlueMap map for the station's world. Copy to plugins/BlueMap/maps/waystation.conf, then /bluemap reload.
# BlueMap renders blocks: the web map shows flat ground with gate markers on it. The gates,
# platforms and signs themselves are display entities, which BlueMap doesn't draw.
world: "waystation"
dimension: "minecraft:overworld"
name: "Central Station"
sorting: -1
start-pos: { x: 0, z: 0 }
sky-color: "#7dabff"
void-color: "#000000"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: -10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
render-mask: [
  {
  }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: false
marker-sets: {
}
