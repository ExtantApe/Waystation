name: Waystation
version: ${version}
main: com.extantape.waystation.WaystationPlugin
api-version: '26.1'
description: Walkable display-entity gates between Multiverse world groups.
# Lets other plugins see Waystation's classes, so they can listen for WaystationAccessEvent and veto a gate.
has-open-classloader: true
# Commands are registered in code, with Paper's registerCommand.
dependencies:
  server:
    # Optional: without it there's no station, but fargates, placed gates and the return command work.
    Multiverse-Core: {load: BEFORE, required: false, join-classpath: true}
    BlueMap: {load: BEFORE, required: false, join-classpath: true}
    # Reached through their own classloaders when present, so no classpath access is needed.
    Multiverse-Inventories: {load: BEFORE, required: false, join-classpath: false}
    LuckPerms: {load: BEFORE, required: false, join-classpath: false}
    GriefPrevention: {load: BEFORE, required: false, join-classpath: false}
    Vault: {load: BEFORE, required: false, join-classpath: false}
    ViaVersion: {load: BEFORE, required: false, join-classpath: false}
    # Optional: its lobby places the lobby gate. Read by name, so Waystation builds and runs without it.
    Latchkey: {load: BEFORE, required: false, join-classpath: false}
permissions:
  # default: false everywhere an admin is concerned: operators get nothing for free.
  waystation.admin:
    description: All of /gate. For a narrower role, grant waystation.admin.<subcommand> instead.
    default: false
  waystation.admin.help: {default: false}
  waystation.admin.list: {default: false}
  waystation.admin.create: {default: false}
  waystation.admin.fargate: {default: false}
  waystation.admin.move: {default: false}
  waystation.admin.link: {default: false}
  waystation.admin.remove: {default: false}
  waystation.admin.test: {default: false}
  waystation.admin.addworld: {default: false}
  waystation.admin.relayout: {default: false}
  waystation.admin.reseed: {default: false}
  waystation.admin.enlarge: {default: false}
  waystation.admin.reload: {default: false}
  waystation.admin.seedead:
    description: See dead gates even without access to the world they led to.
    default: false
  waystation.buy:
    description: Use /buygate.
    default: true
  waystation.find:
    description: Use /waygate.
    default: true
  waystation.move:
    description: Offer a tribute at a waygate's chest. The node name is configurable in config.yml.
    default: true
  waystation.return:
    description: Use the return command. The node name is configurable in config.yml.
    default: false
  waystation.escape:
    description: Use the escape command. The node name is configurable in config.yml.
    default: true
