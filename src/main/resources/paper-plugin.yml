name: Waycave
version: ${version}
main: com.extantape.waycave.WaycavePlugin
api-version: '26.1'
description: A lush glowing cave of your own, with a trail from its start to each world you can reach, and walkable display-entity gates between Multiverse world groups.
# Lets other plugins see Waycave's classes, so they can listen for WaycaveAccessEvent and veto a gate.
has-open-classloader: true
# Commands are registered in code, with Paper's registerCommand.
dependencies:
  server:
    # Optional: without it there's no cave, but fargates, placed gates and the return command work.
    Multiverse-Core: {load: BEFORE, required: false, join-classpath: true}
    BlueMap: {load: BEFORE, required: false, join-classpath: true}
    # Reached through their own classloaders when present, so no classpath access is needed.
    Multiverse-Inventories: {load: BEFORE, required: false, join-classpath: false}
    LuckPerms: {load: BEFORE, required: false, join-classpath: false}
    GriefPrevention: {load: BEFORE, required: false, join-classpath: false}
    Vault: {load: BEFORE, required: false, join-classpath: false}
    ViaVersion: {load: BEFORE, required: false, join-classpath: false}
    # Optional: its lobby places the lobby gate. Read by name, so Waycave builds and runs without it.
    WelcomeWagon: {load: BEFORE, required: false, join-classpath: false}
    # Optional: who can see whom in the cave follows its groups. Read by name. Without it nobody in the cave sees anyone.
    Posse: {load: BEFORE, required: false, join-classpath: false}
    # Optional: with 0.5.0 or newer the start chamber has a gate to another server, for players Wayport allows. Its API
    # is found by name and asked per player.
    Wayport: {load: BEFORE, required: false, join-classpath: false}
permissions:
  # default: false everywhere an admin is concerned: operators get nothing for free.
  waycave.admin:
    description: All of /gate. For a narrower role, grant waycave.admin.<subcommand> instead.
    default: false
  waycave.admin.help: {default: false}
  waycave.admin.list: {default: false}
  waycave.admin.station: {default: false}
  waycave.admin.create: {default: false}
  waycave.admin.fargate: {default: false}
  waycave.admin.move: {default: false}
  waycave.admin.link: {default: false}
  waycave.admin.remove: {default: false}
  waycave.admin.resurface: {default: false}
  waycave.admin.test: {default: false}
  waycave.admin.addworld: {default: false}
  waycave.admin.relayout: {default: false}
  waycave.admin.reseed: {default: false}
  waycave.admin.reload: {default: false}
  waycave.admin.seedead:
    description: See dead gates even without access to the world they led to.
    default: false
  waycave.buy:
    description: Use /buygate.
    default: true
  waycave.find:
    description: Use /waygate.
    default: true
  waycave.move:
    description: Offer a tribute at a waygate's chest. The node name is configurable in config.yml.
    default: true
  waycave.return:
    description: Use the return command. The node name is configurable in config.yml.
    default: false
  waycave.escape:
    description: Use the escape command. The node name is configurable in config.yml.
    default: true
